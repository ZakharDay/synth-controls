    <h1>FM Synth</h1>

    <p>
      FMSynth is composed of two Tone.Synths where one Tone.Synth modulates the
      frequency of a second Tone.Synth. A lot of spectral content can be
      explored using the modulationIndex parameter. Read more about frequency
      modulation synthesis on Sound On Sound:
      <!-- prettier-ignore -->
      <a href="https://web.archive.org/web/20160403123704/http://www.soundonsound.com/sos/apr00/articles/synthsecrets.htm" target="_blank">Part 1</a>
      ,
      <!-- prettier-ignore -->
      <a href="https://web.archive.org/web/20160404062919/http://www.soundonsound.com/sos/may00/articles/synth.htm" target="_blank">Part 2</a>
      .
    </p>
