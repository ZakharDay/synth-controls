    <h1>Poly Synth</h1>

    <p>
      PolySynth handles voice creation and allocation for any instruments passed
      in as the second parameter. PolySynth is not a synthesizer by itself, it
      merely manages voices of one of the other types of synths, allowing any of
      the monophonic synthesizers to be polyphonic.
    </p>
