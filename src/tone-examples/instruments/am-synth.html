    <h1>AM Synth</h1>

    <p>
      AMSynth uses the output of one Tone.Synth to modulate the amplitude of
      another Tone.Synth. The harmonicity (the ratio between the two signals)
      affects the timbre of the output signal greatly. Read more about Amplitude
      Modulation Synthesis on
      <!-- prettier-ignore -->
      <a href="https://web.archive.org/web/20160404103653/http://www.soundonsound.com:80/sos/mar00/articles/synthsecrets.htm" target="_blank">SoundOnSound</a>
      .
