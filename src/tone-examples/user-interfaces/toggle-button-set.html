<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toggle Button Set</title>
    <link rel="stylesheet" href="../../index.css" />
    <script src="toggle-button-set.js"></script>
  </head>

  <body>
    <div class="Button" id="startButton">Start</div>

    <br />

    <div class="ToggleButtonSet" id="typeButtonSet">
      <div class="title">Oscillator Type</div>

      <div>
        <div class="ToggleButton active">fatsine</div>
        <div class="ToggleButton">fatsquare</div>
        <div class="ToggleButton">fatsawtooth</div>
        <div class="ToggleButton">fattriangle</div>
        <div class="ToggleButton">fmsine</div>
        <div class="ToggleButton">fmsquare</div>
        <div class="ToggleButton">fmsawtooth</div>
        <div class="ToggleButton">fmtriangle</div>
        <div class="ToggleButton">amsine</div>
        <div class="ToggleButton">amsquare</div>
        <div class="ToggleButton">amsawtooth</div>
        <div class="ToggleButton">amtriangle</div>
        <div class="ToggleButton">sine</div>
        <div class="ToggleButton">square</div>
        <div class="ToggleButton">sawtooth</div>
        <div class="ToggleButton">triangle</div>
        <div class="ToggleButton">pulse</div>
        <div class="ToggleButton">pwm</div>
      </div>
    </div>

    <div class="source">
      Source:
      <!-- prettier-ignore -->
      <a href="https://github.com/ZakharDay/synth-controls/blob/main/src/tone-examples/user-interfaces/toggle-button-set.html" target="_blank">HTML</a>
      <!-- prettier-ignore -->
      <a href="https://github.com/ZakharDay/synth-controls/blob/main/src/tone-examples/user-interfaces/toggle-button-set.js" target="_blank">JS</a>
    </div>
  </body>
</html>
