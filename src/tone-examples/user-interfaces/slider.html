<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slider</title>
    <link rel="stylesheet" href="../../index.css" />
    <script src="slider.js"></script>
  </head>

  <body>
    <div class="Button" id="startButton">Start</div>

    <br />

    <div class="Slider">
      <div class="title">Channel Volume</div>

      <input
        id="volumeSlider"
        type="range"
        min="-60"
        max="12"
        step="1"
        value="-6"
      />
    </div>

    <div class="source">
      Source:
      <!-- prettier-ignore -->
      <a href="https://github.com/ZakharDay/synth-controls/blob/main/src/tone-examples/user-interfaces/slider.html" target="_blank">HTML</a>
      <!-- prettier-ignore -->
      <a href="https://github.com/ZakharDay/synth-controls/blob/main/src/tone-examples/user-interfaces/slider.js" target="_blank">JS</a>
    </div>
  </body>
</html>
